[project]
name = "mailboxd"
version = "0.1.0"
description = "Multi-mailbox IMAP/SMTP/POP3 control plane — HTTP API + MCP server."
readme = "README.md"
license = { text = "WTFPL" }
requires-python = ">=3.12"
authors = [{ name = "psyb0t" }]
keywords = [
    "imap",
    "smtp",
    "pop3",
    "email",
    "mailbox",
    "fastapi",
    "mcp",
    "model-context-protocol",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
    "fastapi==0.136.1",
    "uvicorn[standard]==0.46.0",
    "pydantic==2.13.3",
    "pyyaml==6.0.3",
    "mcp==1.28.1",
    "html2text==2024.2.26",
]

[project.urls]
Homepage = "https://github.com/psyb0t/docker-mailbox"
Issues = "https://github.com/psyb0t/docker-mailbox/issues"

[project.scripts]
mailboxd = "mailboxd.cli:main"

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "httpx==0.28.1",
    "black==24.10.0",
    "isort==5.13.2",
    "flake8==7.1.1",
    "mypy==1.13.0",
    "types-pyyaml==6.0.12.20240917",
    "testcontainers==4.14.2",
    "requests==2.34.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailboxd"]

[tool.uv]
# Supply-chain defense: only install pkg versions older than `exclude-newer`.
# Bumped automatically by `make pkg-*` targets; do not hand-edit unless you
# know what you're doing. Date is interpreted as UTC midnight of that day.
exclude-newer = "2026-05-17T00:00:00Z"

[tool.isort]
profile = "black"
line_length = 100

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -m 'not docker'"
markers = [
    "docker: integration tests that build + run the docker image (opt-in: pytest -m docker)",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
