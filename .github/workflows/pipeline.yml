name: pipeline

on: [push]

jobs:
  code:
    permissions:
      contents: read
      security-events: write # code-workflow declares it for the sec SARIF upload; a caller must grant at least what the reusable workflow requests or the run fails at startup
    uses: psyb0t/reusable-github-workflows/.github/workflows/code-workflow.yml@master
    with:
      lint_command: "make lint" # flake8 + mypy
      test_command: "make test" # pytest: in-process unit + docker-in-docker integration
      # semgrep + bandit + pip-audit in parallel, merged into sec.sarif. It never
      # fails the build: findings are reported to the Security tab (SARIF upload
      # below), not gated, so a fresh advisory does not block a release.
      sec_command: "make sec"
      sarif_file: "sec.sarif"
      sarif_category: "python" # distinct from the docker image's Grype SARIF category

  badges:
    needs: [code]
    if: github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/create-badges.yml@master

  call-docker-image-workflow:
    needs: [code]
    permissions:
      contents: write # GitHub Release
      security-events: write # upload the Grype SARIF to the Security tab
    uses: psyb0t/reusable-github-workflows/.github/workflows/docker-image-workflow.yml@master

    with:
      repository_name: psyb0t/mailbox
      target_platforms: "linux/amd64,linux/arm64"
      scan_severity: "high"
      # Report scan findings to the Security tab but don't fail the run, so the
      # clawhub publish job below can depend on this workflow succeeding.
      scan_fail_build: false

    secrets:
      dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  # Publish the skills under .agents/skills/ to ClawHub. Tag pushes ONLY, and
  # only after the Docker image build/push + GitHub release have succeeded
  # (needs the docker-image workflow, which does both).
  publish-to-clawhub:
    needs: [call-docker-image-workflow]
    if: startsWith(github.ref, 'refs/tags/')
    uses: psyb0t/reusable-github-workflows/.github/workflows/clawhub-publish.yml@master

    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}

  publish-to-mcp-registry:
    needs: [call-docker-image-workflow]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      id-token: write
      contents: read
    uses: psyb0t/reusable-github-workflows/.github/workflows/mcp-registry-publish.yml@master
