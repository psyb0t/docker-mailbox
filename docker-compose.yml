services:
  mailboxd:
    image: psyb0t/mailbox:latest
    build:
      context: .
    container_name: mailboxd
    restart: unless-stopped
    ports:
      # Host-local by default. Drop the 127.0.0.1 prefix only for deliberate network access.
      - "127.0.0.1:${PORT:-8000}:8000"
    environment:
      WORKERS: ${WORKERS:-2}
      MAILBOXD_CONFIG: /etc/mailboxd/config.yaml
      MAILBOXD_STATE_PATH: /var/lib/mailboxd/state.db
    volumes:
      - ${MAILBOXD_CONFIG:-./config.yaml}:/etc/mailboxd/config.yaml:ro
      # Audit log, send rate limits and "new since" checkpoints (SQLite). No message content.
      - mailboxd-state:/var/lib/mailboxd
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Optional: IMAP IDLE watcher that POSTs HMAC-signed webhooks for new mail.
  # Enable with: docker compose --profile watch up -d
  # Configure targets under `watch.webhooks` in config.yaml.
  watch:
    image: psyb0t/mailbox:latest
    build:
      context: .
    container_name: mailboxd-watch
    profiles: ["watch"]
    restart: unless-stopped
    command: ["mailboxd", "watch", "--config", "/etc/mailboxd/config.yaml"]
    environment:
      MAILBOXD_CONFIG: /etc/mailboxd/config.yaml
      MAILBOXD_STATE_PATH: /var/lib/mailboxd/state.db
    volumes:
      - ${MAILBOXD_CONFIG:-./config.yaml}:/etc/mailboxd/config.yaml:ro
      - mailboxd-state:/var/lib/mailboxd
    healthcheck:
      disable: true

volumes:
  mailboxd-state:
